name: Castle Crashers Android 1.0.4 — Runtime and Original Menu

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: castle-android-104-runtime-menu
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and Winlator submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: "platform-tools"

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download official Castle Crashers PC artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -fL --retry 3 https://cdn.cloudflare.steamstatic.com/steam/apps/204360/header.jpg -o app/src/main/res/drawable-nodpi/castle_header.jpg || curl -fL --retry 3 https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/204360/header.jpg -o app/src/main/res/drawable-nodpi/castle_header.jpg
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          source = Image.open("app/src/main/res/drawable-nodpi/castle_header.jpg").convert("RGB")
          width, height = source.size
          side = min(width, height)
          left = (width - side) // 2
          top = (height - side) // 2
          source.crop((left, top, left + side, top + side)).resize((512, 512), Image.Resampling.LANCZOS).save("app/src/main/res/drawable-nodpi/castle_pc_icon.jpg", quality=92)
          PY
          test -s app/src/main/res/drawable-nodpi/castle_pc_icon.jpg
          test -s app/src/main/res/drawable-nodpi/castle_header.jpg

      - name: Include third-party notices
        run: |
          mkdir -p app/src/main/assets/licenses
          find vendor/winlator-app -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) -not -path '*/.git/*' -exec cp --parents {} app/src/main/assets/licenses/ \;
          cp THIRD_PARTY_NOTICES.md app/src/main/assets/licenses/CASTLE_THIRD_PARTY_NOTICES.md

      - name: Apply Winlator integration and package authority patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("vendor/winlator-app/app/src/main/java/com/winlator")
          p = root / "xenvironment/RootFSInstaller.java"
          s = p.read_text()
          s = s.replace("public static void install(final MainActivity activity)", "public static void install(final AppCompatActivity activity)")
          s = s.replace("public static void installIfNeeded(final MainActivity activity)", "public static void installIfNeeded(final AppCompatActivity activity)")
          if "public static void install(final AppCompatActivity activity)" not in s:
              raise SystemExit("RootFSInstaller host patch failed")
          p.write_text(s)

          p = root / "XServerDisplayActivity.java"
          s = p.read_text()
          old = """        if (shortcut != null) {
                      String controlsProfile = shortcut.getExtra("controlsProfile");
                      if (!controlsProfile.isEmpty()) {
                          ControlsProfile profile = inputControlsManager.getProfile(Integer.parseInt(controlsProfile));
                          if (profile != null) showInputControls(profile);
                      }
                  }
          """
          if old in s:
              new = old + """        else if (getIntent().getBooleanExtra("castle_touch_controls", true)) {
                      ControlsProfile profile = inputControlsManager.getProfile(3);
                      if (profile != null) showInputControls(profile);
                  }
          """
              s = s.replace(old, new, 1)
          elif "castle_touch_controls" not in s:
              raise SystemExit("Touchscreen controls patch point not found")
          p.write_text(s)

          p = root / "MainActivity.java"
          s = p.read_text().replace("if (!requestAppPermissions()) RootFSInstaller.installIfNeeded(this);", "RootFSInstaller.installIfNeeded(this);")
          p.write_text(s)

          p = root / "core/FileUtils.java"
          s = p.read_text()
          if "com.winlator.FileProvider" not in s and "com.crazybreakdown.castlecrashers.mobile.v101.FileProvider" not in s:
              raise SystemExit("Winlator FileProvider authority not found")
          p.write_text(s.replace("com.winlator.FileProvider", "com.crazybreakdown.castlecrashers.mobile.v101.FileProvider"))

          # Let the Castle launcher detect a failed RootFS extraction.
          p = root / "xenvironment/RootFSInstaller.java"
          s = p.read_text()
          anchor = "        final File rootDir = rootFS.getRootDir();"
          state_init = anchor + """
                  final File castleState = new File(activity.getFilesDir(), ".castle_rootfs_install_state");
                  try (java.io.FileOutputStream out = new java.io.FileOutputStream(castleState)) {
                      out.write("installing".getBytes(java.nio.charset.StandardCharsets.UTF_8));
                  } catch (Exception ignored) {}
          """
          if "castle_rootfs_install_state" not in s:
              if anchor not in s: raise SystemExit("RootFS state init patch point missing")
              s = s.replace(anchor, state_init, 1)
          old_state = """
            if (success) {
                rootFS.createRFSVersionFile(LATEST_VERSION);
                resetContainerRFSVersions(activity);
            }
            else AppUtils.showToast(activity, R.string.unable_to_install_system_files);
          """
          new_state = """
            if (success) {
                rootFS.createRFSVersionFile(LATEST_VERSION);
                resetContainerRFSVersions(activity);
            }
            else AppUtils.showToast(activity, R.string.unable_to_install_system_files);
            try (java.io.FileOutputStream out = new java.io.FileOutputStream(castleState)) {
                out.write((success ? "ready" : "failed").getBytes(java.nio.charset.StandardCharsets.UTF_8));
            } catch (Exception ignored) {}
          """
          if 'out.write((success ? "ready" : "failed")' not in s:
              if old_state not in s: raise SystemExit("RootFS state completion patch point missing")
              s = s.replace(old_state, new_state, 1)
          p.write_text(s)
          PY

      - name: Verify isolated package identity
        run: |
          grep -q 'applicationId = "com.crazybreakdown.castlecrashers.mobile.v101"' app/build.gradle.kts
          grep -q 'com.crazybreakdown.castlecrashers.mobile.v101.FileProvider' app/src/main/AndroidManifest.xml
          grep -q 'com.crazybreakdown.castlecrashers.mobile.v101.FileProvider' vendor/winlator-app/app/src/main/java/com/winlator/core/FileUtils.java

      - name: Restore persistent signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: castle-android-debug-signing-v1

      - name: Ensure signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -storetype JKS -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Castle Crashers,O=Castle,C=BR"
          fi

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK package, runtime and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 100000000
          unzip -l "$APK" > apk-files.txt
          grep -q "assets/rootfs.tzst" apk-files.txt
          grep -q "assets/box64/" apk-files.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.crazybreakdown.castlecrashers.mobile.v101' versionCode='12' versionName='1.0.4'"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Castle-Crashers-v1.0.4-arm64.apk
          sha256sum release/Castle-Crashers-v1.0.4-arm64.apk > release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Castle-Crashers-v1.0.4-ARM64
          path: |
            release/Castle-Crashers-v1.0.4-arm64.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: Castle Crashers V1.0.4
          make_latest: true
          overwrite_files: true
          files: |
            release/Castle-Crashers-v1.0.4-arm64.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            Castle Crashers Android 1.0.4 — original game artwork and safer first-run Wine startup.
            Includes embedded Winlator/Wine/Box64 runtime. Bring your own legally obtained game files.

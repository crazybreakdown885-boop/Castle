name: Castle Crashers Android 1.0.6 — Runtime and Original Menu

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: castle-android-106-runtime-menu
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and Winlator submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: "platform-tools"

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download official Castle Crashers PC artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -fL --retry 3 https://cdn.cloudflare.steamstatic.com/steam/apps/204360/header.jpg -o app/src/main/res/drawable-nodpi/castle_header.jpg || curl -fL --retry 3 https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/204360/header.jpg -o app/src/main/res/drawable-nodpi/castle_header.jpg
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          source = Image.open("app/src/main/res/drawable-nodpi/castle_header.jpg").convert("RGB")
          width, height = source.size
          side = min(width, height)
          left = (width - side) // 2
          top = (height - side) // 2
          source.crop((left, top, left + side, top + side)).resize((512, 512), Image.Resampling.LANCZOS).save("app/src/main/res/drawable-nodpi/castle_pc_icon.jpg", quality=92)
          PY
          test -s app/src/main/res/drawable-nodpi/castle_pc_icon.jpg
          test -s app/src/main/res/drawable-nodpi/castle_header.jpg

      - name: Include third-party notices
        run: |
          mkdir -p app/src/main/assets/licenses
          find vendor/winlator-app -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) -not -path '*/.git/*' -exec cp --parents {} app/src/main/assets/licenses/ \;
          cp THIRD_PARTY_NOTICES.md app/src/main/assets/licenses/CASTLE_THIRD_PARTY_NOTICES.md

      - name: Apply Winlator integration and package authority patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("vendor/winlator-app/app/src/main/java/com/winlator")
          p = root / "xenvironment/RootFSInstaller.java"
          s = p.read_text()
          s = s.replace("public static void install(final MainActivity activity)", "public static void install(final AppCompatActivity activity)")
          s = s.replace("public static void installIfNeeded(final MainActivity activity)", "public static void installIfNeeded(final AppCompatActivity activity)")
          if "public static void install(final AppCompatActivity activity)" not in s:
              raise SystemExit("RootFSInstaller host patch failed")
          p.write_text(s)

          p = root / "XServerDisplayActivity.java"
          s = p.read_text()
          old = """        if (shortcut != null) {
                      String controlsProfile = shortcut.getExtra("controlsProfile");
                      if (!controlsProfile.isEmpty()) {
                          ControlsProfile profile = inputControlsManager.getProfile(Integer.parseInt(controlsProfile));
                          if (profile != null) showInputControls(profile);
                      }
                  }
          """
          if old in s:
              new = old + """        else if (getIntent().getBooleanExtra("castle_touch_controls", true)) {
                      ControlsProfile profile = inputControlsManager.getProfile(3);
                      if (profile != null) showInputControls(profile);
                  }
          """
              s = s.replace(old, new, 1)
          elif "castle_touch_controls" not in s:
              raise SystemExit("Touchscreen controls patch point not found")
          p.write_text(s)

          p = root / "MainActivity.java"
          s = p.read_text().replace("if (!requestAppPermissions()) RootFSInstaller.installIfNeeded(this);", "RootFSInstaller.installIfNeeded(this);")
          p.write_text(s)

          p = root / "core/FileUtils.java"
          s = p.read_text()
          if "com.winlator.FileProvider" not in s and "com.crazybreakdown.castlecrashers.mobile.v101.FileProvider" not in s:
              raise SystemExit("Winlator FileProvider authority not found")
          p.write_text(s.replace("com.winlator.FileProvider", "com.crazybreakdown.castlecrashers.mobile.v101.FileProvider"))

          # Replace the installer method as a whole to keep Java braces and error handling valid.
          p = root / "xenvironment/RootFSInstaller.java"
          s = p.read_text()
          method_start = s.index("    public static void install(final AppCompatActivity activity) {")
          method_end = s.index("    public static void installIfNeeded", method_start)
          method = """    public static void install(final AppCompatActivity activity) {
                  AppUtils.keepScreenOn(activity);
                  RootFS rootFS = RootFS.find(activity);
                  final File rootDir = rootFS.getRootDir();
                  final File castleState = new File(activity.getFilesDir(), ".castle_rootfs_install_state");
                  try (java.io.FileOutputStream out = new java.io.FileOutputStream(castleState)) {
                      out.write("installing".getBytes(java.nio.charset.StandardCharsets.UTF_8));
                  } catch (Exception ignored) {}
                  SettingsFragment.resetPreferenceVersions(activity);
                  final DownloadProgressDialog dialog = new DownloadProgressDialog(activity);
                  dialog.show(R.string.installing_system_files);
                  Executors.newSingleThreadExecutor().execute(() -> {
                      try {
                          clearRootDir(rootDir);
                          final long contentLength = TarCompressorUtils.getContentLength(TarCompressorUtils.Type.ZSTD, activity, FILENAME, rootDir);
                          AtomicLong totalSizeRef = new AtomicLong();
                          boolean success = TarCompressorUtils.extract(TarCompressorUtils.Type.ZSTD, activity, FILENAME, rootDir, (file, size) -> {
                              if (size > 0) {
                                  long totalSize = totalSizeRef.addAndGet(size);
                                  final int progress = (int)(((float)totalSize / contentLength) * 100);
                                  activity.runOnUiThread(() -> dialog.setProgress(progress));
                              }
                              return file;
                          });
                          if (success) {
                              rootFS.createRFSVersionFile(LATEST_VERSION);
                              resetContainerRFSVersions(activity);
                          } else {
                              AppUtils.showToast(activity, R.string.unable_to_install_system_files);
                          }
                          try (java.io.FileOutputStream out = new java.io.FileOutputStream(castleState)) {
                              out.write((success ? "ready" : "failed").getBytes(java.nio.charset.StandardCharsets.UTF_8));
                          } catch (Exception ignored) {}
                      } catch (Throwable error) {
                          error.printStackTrace();
                          try (java.io.FileOutputStream out = new java.io.FileOutputStream(castleState)) {
                              out.write("failed".getBytes(java.nio.charset.StandardCharsets.UTF_8));
                          } catch (Exception ignored) {}
                          AppUtils.showToast(activity, R.string.unable_to_install_system_files);
                      } finally {
                          dialog.closeOnUiThread();
                      }
                  });
              }

          """
          s = s[:method_start] + method + s[method_end:]
          p.write_text(s)

          # Always return a callback if asynchronous container creation throws.
          p = root / "container/ContainerManager.java"
          s = p.read_text()
          old = "            final Container container = createContainer(data);\n            handler.post(() -> callback.call(container));"
          new = """            Container container;
                      try {
                          container = createContainer(data);
                      } catch (Throwable error) {
                          error.printStackTrace();
                          container = null;
                      }
                      final Container result = container;
                      handler.post(() -> callback.call(result));"""
          if "final Container result = container;" not in s:
              if old not in s: raise SystemExit("Container async callback patch point missing")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Recover interrupted Winlator container creation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/winlator-app/app/src/main/java/com/winlator/container/ContainerManager.java")
          s = p.read_text()
          old = '''                            JSONObject data = new JSONObject(FileUtils.readString(container.getConfigFile()));
                            container.loadData(data);'''
          new = '''                            if (!container.getConfigFile().isFile()) {
                                FileUtils.delete(file);
                                continue;
                            }
                            JSONObject data = new JSONObject(FileUtils.readString(container.getConfigFile()));
                            container.loadData(data);'''
          if old not in s:
              raise SystemExit("Container scan recovery patch point not found")
          s = s.replace(old, new, 1)
          old = '''            File containerDir = new File(homeDir, RootFS.USER+"-"+id);
            if (!containerDir.mkdirs()) return null;'''
          new = '''            File containerDir = new File(homeDir, RootFS.USER+"-"+id);
            // A previous process may have been killed while extracting the prefix.
            // Remove an incomplete directory before retrying the same container ID.
            if (containerDir.exists()) FileUtils.delete(containerDir);
            if (!containerDir.mkdirs()) return null;'''
          if old not in s:
              raise SystemExit("Container creation recovery patch point not found")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify isolated package identity
        run: |
          grep -q 'applicationId = "com.crazybreakdown.castlecrashers.mobile.v101"' app/build.gradle.kts
          grep -q 'com.crazybreakdown.castlecrashers.mobile.v101.FileProvider' app/src/main/AndroidManifest.xml
          grep -q 'com.crazybreakdown.castlecrashers.mobile.v101.FileProvider' vendor/winlator-app/app/src/main/java/com/winlator/core/FileUtils.java

      - name: Restore persistent signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: castle-android-debug-signing-v1

      - name: Ensure signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -storetype JKS -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Castle Crashers,O=Castle,C=BR"
          fi

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK package, runtime and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 100000000
          unzip -l "$APK" > apk-files.txt
          grep -q "assets/rootfs.tzst" apk-files.txt
          grep -q "assets/box64/" apk-files.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.crazybreakdown.castlecrashers.mobile.v101' versionCode='14' versionName='1.0.6'"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Castle-Crashers-v1.0.6-arm64.apk
          sha256sum release/Castle-Crashers-v1.0.6-arm64.apk > release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Castle-Crashers-v1.0.6-ARM64
          path: |
            release/Castle-Crashers-v1.0.6-arm64.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: Castle Crashers V1.0.6
          make_latest: true
          overwrite_files: true
          files: |
            release/Castle-Crashers-v1.0.6-arm64.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            Castle Crashers Android 1.0.6 — safer first-run Wine startup and embedded Winlator runtime.
            Includes embedded Winlator/Wine/Box64 runtime. Bring your own legally obtained game files.

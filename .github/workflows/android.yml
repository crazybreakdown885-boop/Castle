name: Castle Crashers V1 — Android APK and Release

on:
  push:
    branches: [ "main", "castle-v1.0.0-final" ]
  workflow_dispatch:

concurrency:
  group: castle-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source with Winlator submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Include upstream license and notice files in the APK
        run: |
          mkdir -p app/src/main/assets/licenses
          find vendor/winlator-app -type f \\( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \\) -not -path '*/.git' -not -path '*/.git/*' -exec cp --parents {} app/src/main/assets/licenses/ \\;
          cp THIRD_PARTY_NOTICES.md app/src/main/assets/licenses/CASTLE_THIRD_PARTY_NOTICES.md

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required NDK and CMake versions
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply Winlator host and touchscreen integration patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vendor/winlator-app/app/src/main/java/com/winlator/xenvironment/RootFSInstaller.java")
          source = path.read_text()
          source = source.replace("public static void install(final MainActivity activity)", "public static void install(final AppCompatActivity activity)")
          source = source.replace("public static void installIfNeeded(final MainActivity activity)", "public static void installIfNeeded(final AppCompatActivity activity)")
          if "public static void install(final AppCompatActivity activity)" not in source:
              raise SystemExit("RootFSInstaller patch did not apply")
          path.write_text(source)

          display = Path("vendor/winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java")
          source = display.read_text()
          old = """        if (shortcut != null) {
            String controlsProfile = shortcut.getExtra("controlsProfile");
            if (!controlsProfile.isEmpty()) {
                ControlsProfile profile = inputControlsManager.getProfile(Integer.parseInt(controlsProfile));
                if (profile != null) showInputControls(profile);
            }
        }
"""
          new = old + """        else if (getIntent().getBooleanExtra("castle_touch_controls", true)) {
            ControlsProfile profile = inputControlsManager.getProfile(3);
            if (profile != null) showInputControls(profile);
        }
"""
          if old not in source:
              raise SystemExit("Touchscreen profile patch did not apply")
          display.write_text(source.replace(old, new, 1))

          main = Path("vendor/winlator-app/app/src/main/java/com/winlator/MainActivity.java")
          source = main.read_text()
          source = source.replace("if (!requestAppPermissions()) RootFSInstaller.installIfNeeded(this);", "RootFSInstaller.installIfNeeded(this);")
          main.write_text(source)

          file_utils = Path("vendor/winlator-app/app/src/main/java/com/winlator/core/FileUtils.java")
          source = file_utils.read_text()
          if "com.winlator.FileProvider" not in source:
              raise SystemExit("Winlator FileProvider authority was not found")
          file_utils.write_text(source.replace(
              "com.winlator.FileProvider",
              "com.crazybreakdown.castlecrashers.mobile.FileProvider"
          ))
          PY

      - name: Verify isolated Android package and provider identity
        run: |
          grep -q "com.crazybreakdown.castlecrashers.mobile.FileProvider" app/src/main/AndroidManifest.xml
          grep -q "com.crazybreakdown.castlecrashers.mobile.FileProvider" vendor/winlator-app/app/src/main/java/com/winlator/core/FileUtils.java

      - name: Add system CPU utilization to the Winlator performance HUD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cpu = Path("vendor/winlator-app/app/src/main/java/com/winlator/core/CPUStatus.java")
          source = cpu.read_text()
          marker = "    public static String formatClockSpeed"
          method = """    private static long lastTotalTicks = -1;
              private static long lastIdleTicks = -1;

              public static synchronized int getUsage() {
                  try (RandomAccessFile reader = new RandomAccessFile("/proc/stat", "r")) {
                      String line = reader.readLine();
                      if (line == null || !line.startsWith("cpu ")) return -1;
                      String[] fields = line.trim().split("\\\\s+");
                      if (fields.length < 5) return -1;
                      long total = 0;
                      for (int i = 1; i < fields.length && i < 9; i++) total += Long.parseLong(fields[i]);
                      long idle = Long.parseLong(fields[4]);
                      if (fields.length > 5) idle += Long.parseLong(fields[5]);
                      if (lastTotalTicks < 0) {
                          lastTotalTicks = total;
                          lastIdleTicks = idle;
                          return 0;
                      }
                      long totalDelta = total - lastTotalTicks;
                      long idleDelta = idle - lastIdleTicks;
                      lastTotalTicks = total;
                      lastIdleTicks = idle;
                      if (totalDelta <= 0) return -1;
                      return Math.max(0, Math.min(100, (int)Math.round((totalDelta - idleDelta) * 100.0 / totalDelta)));
                  }
                  catch (Exception e) {
                      return -1;
                  }
              }

          """
          if "public static synchronized int getUsage()" not in source:
              if marker not in source:
                  raise SystemExit("CPUStatus insertion point not found")
              cpu.write_text(source.replace(marker, method + marker, 1))

          rating = Path("vendor/winlator-app/app/src/main/java/com/winlator/widget/FrameRating.java")
          source = rating.read_text()
          source = source.replace("import com.winlator.box64.Box64Utils;\\n", "")
          source = source.replace("    private String cpuInfo = null;\\n", "")
          old_info = """            if (cpuInfo == null) {
                cpuInfo = "Box64 v"+ Box64Utils.extractBinVersion(cpuPanel.getContext());
            }

          """
          if old_info not in source:
              raise SystemExit("FrameRating CPU info block not found")
          source = source.replace(old_info, "")
          old_text = '            ((TextView)cpuPanel.getChildAt(1)).setText(CPUStatus.formatClockSpeed(maxClockSpeed)+" | "+cpuInfo);'
          new_text = """            int cpuUsage = CPUStatus.getUsage();
                      String cpuUsageText = cpuUsage >= 0 ? cpuUsage + "%" : "N/A";
                      ((TextView)cpuPanel.getChildAt(1)).setText(CPUStatus.formatClockSpeed(maxClockSpeed)+" • "+cpuUsageText);"""
          if old_text not in source:
              raise SystemExit("FrameRating CPU display patch did not apply")
          rating.write_text(source.replace(old_text, new_text, 1))
          PY

      - name: Restore stable Android debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: castle-android-debug-signing-v1

      - name: Build integrated Android APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify embedded runtime and APK signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 100000000
          unzip -l "$APK" > apk-contents.txt
          grep -q "assets/rootfs.tzst" apk-contents.txt
          grep -q "assets/container_pattern.tzst" apk-contents.txt
          grep -q "assets/box64/" apk-contents.txt
          grep -q "assets/pulseaudio.tzst" apk-contents.txt
          grep -q "assets/inputcontrols/profiles/controls-3.icp" apk-contents.txt
          grep -q "assets/licenses/CASTLE_THIRD_PARTY_NOTICES.md" apk-contents.txt
          grep -q "assets/licenses/vendor/winlator-app/LICENSE" apk-contents.txt
          grep -q "lib/arm64-v8a/libzstd-jni-1.5.2-3.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libwinlator.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libvortekrenderer.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libgladiorenderer.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libvirglrenderer.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libmidihandler.so" apk-contents.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Castle-Crashers-v1.0.0-arm64.apk
          sha256sum release/Castle-Crashers-v1.0.0-arm64.apk | tee release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload the single installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Castle-Crashers-v1.0.0-ARM64
          path: |
            release/Castle-Crashers-v1.0.0-arm64.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Castle Crashers V1
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Castle Crashers V1
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release/Castle-Crashers-v1.0.0-arm64.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            Castle Crashers V1 — Android ARM64.
            Includes the embedded Winlator/Wine/Box64 runtime.
            The commercial game files are not included; import your own legally obtained Windows game folder.
            LAN gameplay and Steamworks online are not implemented.

name: Build Android APK and publish Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastleCrashersMobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-native-preview
          name: Castle Brawlers Mobile v0.2.0 (Prévia nativa)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Prévia jogável de um beat-em-up 2D original, desenhado e executado diretamente no Android.

            **Estado:** protótipo de jogo 2D nativo Android com combate, inimigos, pontuação e controles touch. Não contém arquivos/código de Castle Crashers, não integra Steam e ainda não oferece multiplayer online.
            APK de depuração para testes.

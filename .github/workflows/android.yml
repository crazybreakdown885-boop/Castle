name: Build Android APK and publish Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastleCrashersMobile-v0.3.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: Castle Brawlers Mobile v0.3.0
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            APK Android da versão 0.3.0.

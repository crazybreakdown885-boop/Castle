name: Build Castle Mobile 0.3.0 Android APK
on:
  push:
    branches: [ "main", "v0.3.0" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Adapt Winlator rootfs bootstrap to the host Activity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vendor/winlator-app/app/src/main/java/com/winlator/xenvironment/RootFSInstaller.java")
          source = path.read_text()
          source = source.replace("public static void install(final MainActivity activity)", "public static void install(final AppCompatActivity activity)")
          source = source.replace("public static void installIfNeeded(final MainActivity activity)", "public static void installIfNeeded(final AppCompatActivity activity)")
          if "public static void install(final AppCompatActivity activity)" not in source:
              raise SystemExit("Winlator RootFSInstaller patch did not apply")
          path.write_text(source)

          display = Path("vendor/winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java")
          source = display.read_text()
          old = """        if (shortcut != null) {
            String controlsProfile = shortcut.getExtra("controlsProfile");
            if (!controlsProfile.isEmpty()) {
                ControlsProfile profile = inputControlsManager.getProfile(Integer.parseInt(controlsProfile));
                if (profile != null) showInputControls(profile);
            }
        }
"""
          new = """        if (shortcut != null) {
            String controlsProfile = shortcut.getExtra("controlsProfile");
            if (!controlsProfile.isEmpty()) {
                ControlsProfile profile = inputControlsManager.getProfile(Integer.parseInt(controlsProfile));
                if (profile != null) showInputControls(profile);
            }
        }
        else if (getIntent().getBooleanExtra("castle_touch_controls", true)) {
            ControlsProfile profile = inputControlsManager.getProfile(3);
            if (profile != null) showInputControls(profile);
        }
"""
          if old not in source:
              raise SystemExit("Winlator touchscreen profile patch did not apply")
          display.write_text(source)

          main = Path("vendor/winlator-app/app/src/main/java/com/winlator/MainActivity.java")
          source = main.read_text()
          source = source.replace("if (!requestAppPermissions()) RootFSInstaller.installIfNeeded(this);", "RootFSInstaller.installIfNeeded(this);")
          main.write_text(source)
          PY
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastleMobile-0.3.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Build Castle Mobile 0.3.1 Android APK
on:
  push:
    branches: [ "main", "ui-install-fix-0.3.1" ]
  workflow_dispatch:
concurrency:
  group: castle-mobile-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Adapt Winlator runtime to Castle host and touchscreen profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vendor/winlator-app/app/src/main/java/com/winlator/xenvironment/RootFSInstaller.java")
          source = path.read_text()
          source = source.replace("public static void install(final MainActivity activity)", "public static void install(final AppCompatActivity activity)")
          source = source.replace("public static void installIfNeeded(final MainActivity activity)", "public static void installIfNeeded(final AppCompatActivity activity)")
          if "public static void install(final AppCompatActivity activity)" not in source:
              raise SystemExit("Winlator RootFSInstaller patch did not apply")
          path.write_text(source)
          display = Path("vendor/winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java")
          source = display.read_text()
          old = "        if (shortcut != null) {\n            String controlsProfile = shortcut.getExtra(\"controlsProfile\");\n            if (!controlsProfile.isEmpty()) {\n                ControlsProfile profile = inputControlsManager.getProfile(Integer.parseInt(controlsProfile));\n                if (profile != null) showInputControls(profile);\n            }\n        }\n"
          new = "        if (shortcut != null) {\n            String controlsProfile = shortcut.getExtra(\"controlsProfile\");\n            if (!controlsProfile.isEmpty()) {\n                ControlsProfile profile = inputControlsManager.getProfile(Integer.parseInt(controlsProfile));\n                if (profile != null) showInputControls(profile);\n            }\n        }\n        else if (getIntent().getBooleanExtra(\"castle_touch_controls\", true)) {\n            ControlsProfile profile = inputControlsManager.getProfile(3);\n            if (profile != null) showInputControls(profile);\n        }\n"
          if old not in source:
              raise SystemExit("Winlator touchscreen profile patch did not apply")
          display.write_text(source.replace(old, new))
          main = Path("vendor/winlator-app/app/src/main/java/com/winlator/MainActivity.java")
          source = main.read_text()
          source = source.replace("if (!requestAppPermissions()) RootFSInstaller.installIfNeeded(this);", "RootFSInstaller.installIfNeeded(this);")
          main.write_text(source)
          PY
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify embedded Windows runtime payload
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > apk-contents.txt
          grep -q "assets/rootfs.tzst" apk-contents.txt
          grep -q "assets/container_pattern.tzst" apk-contents.txt
          grep -q "assets/box64/" apk-contents.txt
          grep -q "assets/pulseaudio.tzst" apk-contents.txt
          grep -q "assets/inputcontrols/profiles/controls-3.icp" apk-contents.txt
          grep -q "lib/arm64-v8a/libzstd-jni-1.5.2-3.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libwinlator.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libvortekrenderer.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libgladiorenderer.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libvirglrenderer.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libmidihandler.so" apk-contents.txt\n          cp "$APK" CastleMobile-0.3.1.apk\n          test -s CastleMobile-0.3.1.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastleMobile-0.3.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release v0.3.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1
          name: Castle Crashers Mobile v0.3.1
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: CastleMobile-0.3.1.apk
          fail_on_unmatched_files: true
          body: |
            Atualização do launcher Castle Crashers Mobile.
            Novo ícone, interface redesenhada e identificador Android independente para evitar conflito com a instalação anterior.
            Runtime Windows/Winlator integrado; arquivos do jogo devem ser importados pelo usuário.
